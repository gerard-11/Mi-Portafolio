<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="url(#bgGradient)"/>

  <!-- Title area -->
  <rect x="20" y="20" width="360" height="50" fill="rgba(6, 182, 212, 0.1)" rx="8"/>
  <text x="200" y="50" font-size="28" font-weight="bold" fill="#06b6d4" text-anchor="middle" font-family="monospace">
    Call Center
  </text>

  <!-- Phone icon -->
  <g transform="translate(80, 100)">
    <rect x="0" y="0" width="50" height="80" rx="4" fill="none" stroke="#06b6d4" stroke-width="2"/>
    <circle cx="25" cy="20" r="8" fill="#ec4899"/>
    <line x1="5" y1="35" x2="45" y2="35" stroke="#06b6d4" stroke-width="1" opacity="0.5"/>
    <line x1="5" y1="45" x2="45" y2="45" stroke="#06b6d4" stroke-width="1" opacity="0.5"/>
    <line x1="5" y1="55" x2="45" y2="55" stroke="#06b6d4" stroke-width="1" opacity="0.5"/>
    <circle cx="25" cy="70" r="3" fill="#06b6d4"/>
  </g>

  <!-- Dashboard icon -->
  <g transform="translate(180, 100)">
    <rect x="0" y="0" width="70" height="50" rx="4" fill="none" stroke="#06b6d4" stroke-width="2"/>
    <rect x="5" y="5" width="20" height="15" fill="#06b6d4" opacity="0.3"/>
    <rect x="30" y="5" width="20" height="15" fill="#ec4899" opacity="0.3"/>
    <rect x="5" y="25" width="45" height="2" fill="#06b6d4" opacity="0.5"/>
    <rect x="5" y="32" width="35" height="2" fill="#06b6d4" opacity="0.5"/>
  </g>

  <!-- Real-time indicator -->
  <g transform="translate(300, 120)">
    <circle cx="0" cy="0" r="8" fill="none" stroke="#ec4899" stroke-width="2"/>
    <circle cx="0" cy="0" r="4" fill="#ec4899"/>
    <circle cx="0" cy="0" r="10" fill="none" stroke="#ec4899" stroke-width="1" opacity="0.5">
      <animate attributeName="r" from="10" to="18" dur="1.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" from="0.8" to="0" dur="1.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Status badges -->
  <g transform="translate(20, 220)">
    <rect x="0" y="0" width="360" height="60" fill="rgba(6, 182, 212, 0.05)" rx="6" stroke="rgba(6, 182, 212, 0.2)" stroke-width="1"/>

    <!-- Status -->
    <circle cx="30" cy="20" r="8" fill="#06b6d4"/>
    <text x="50" y="24" font-size="12" fill="#06b6d4" font-family="monospace">Status: 🚀 In Development</text>

    <!-- Stack -->
    <text x="20" y="50" font-size="10" fill="#94a3b8" font-family="monospace">NestJS • Prisma • PostgreSQL • Socket.io • React</text>
  </g>
</svg>
